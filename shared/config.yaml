# Demo-friendly thresholds. Switch to `production` values for real use.
profile: demo

demo:
  still_threshold_s: 60          # sedentary this long -> prompt a walk
  motion_energy_moving: 0.05     # g; above = moving (tune on real wearable)
  walk_check_s: 20               # after "Follow me", user must be moving within this
  max_reasks: 3                  # then back off
  med_usual_time: "auto"         # learned; override e.g. "09:00" for the demo
  med_late_after_s: 45           # seconds after usual time (demo-scaled)
  dock_reach_mm: 150
  obstacle_stop_mm: 250
  follow_distance_mm: 400
  wake_word: "charlie"

production:
  still_threshold_s: 2700        # 45 min
  walk_check_s: 120
  max_reasks: 2
  med_late_after_s: 1800
  decline_pct: 30                # activity drop vs 7-day mean
  decline_days: 3
  quiet_hours: ["22:00", "08:00"]

gateway:
  wearable_project_id: "FILL_ME"
  robot_project_id: "FILL_ME"
elevenlabs:
  api_key_env: ELEVENLABS_API_KEY   # never commit keys
  voice_id: "FILL_ME"               # pick a warm voice
  tts_model: "eleven_flash_v2_5"

# Charlie's story (services/brain/run_story.py). x and y are the two knobs.
story:
  x_pill_after_s: 10        # X: seconds after the "Charlie" greeting until the pill request
  y_idle_window_s: 7        # Y: no movement for this long -> ask the user to move
  pill_repeat_s: 5          # asks again this often while the pill is not taken
  max_reasks: 3             # then a gentle back-off
  walk_s: 10                # robot drives this long after the 'Follow me' line
  speed_slow: 60            # 0..255 (before the motors' minimum PWM): user sitting
  speed_fast: 220           # user moving
  dock_near_mm: 40          # dock sensor (port 7): closer than this = pill is on the sensor. Calibrate!
  motion_energy_moving: 0.05  # wearable energy (g) at/above this = moving. Calibrate!
