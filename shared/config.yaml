# Demo-friendly thresholds. Switch to `production` values for real use.
profile: demo

demo:
  still_threshold_s: 60          # sedentary this long -> prompt a walk
  motion_energy_moving: 0.05     # g; above = moving (tune on real wearable)
  walk_check_s: 20               # after "Follow me", user must be moving within this
  max_reasks: 3                  # then back off
  med_usual_time: "auto"         # learned; override e.g. "09:00" for the demo
  med_late_after_s: 45           # seconds after usual time (demo-scaled)
  dock_reach_mm: 150
  obstacle_stop_mm: 250
  follow_distance_mm: 400
  wake_word: "charlie"

production:
  still_threshold_s: 2700        # 45 min
  walk_check_s: 120
  max_reasks: 2
  med_late_after_s: 1800
  decline_pct: 30                # activity drop vs 7-day mean
  decline_days: 3
  quiet_hours: ["22:00", "08:00"]

# Demo runner (tools/demo): one day on a fast clock. Times are real-life times; only day_s changes.
demo_clock:
  day_s: 180                     # real seconds per clock day (86400 = real time)
  wake_at: "08:00"               # wake-up call
  pill_at: "09:00"               # daily pill
  sleep_at: "22:00"              # bedtime: quiet until the next wake-up
  move_after_min: 45             # still this long -> walk reminder
  remind_again_min: 20           # between reminders
  walk_backoff_min: 120          # after 3 walk reminders: quiet this long
  walk_goal_min: 15              # walking this long (short stops allowed) = a walk done

gateway:
  wearable_project_id: "FILL_ME"
  robot_project_id: "FILL_ME"
elevenlabs:
  api_key_env: ELEVENLABS_API_KEY   # never commit keys
  voice_id: "FILL_ME"               # pick a warm voice
  tts_model: "eleven_flash_v2_5"

# Charlie's story (services/brain/run_story.py). x and y are the two knobs.
story:
  x_pill_after_s: 10        # X: seconds after the "Charlie" greeting until the pill request
  y_idle_window_s: 10        # Y: no movement for this long -> ask the user to move
  pill_repeat_s: 5          # asks again this often while the pill is not taken
  max_reasks: 3             # then a gentle back-off
  walk_s: 10                # robot drives this long after the 'Follow me' line
  topic_gap_s: 8            # break between the pill and a walk ask (both ways): never asked back to back
  follow_window_s: 10       # walk time after 'Follow me': no movement at all in it -> sad eyes + sad line
  speed_slow: 60            # 0..255 (before the motors' minimum PWM): user sitting
  speed_fast: 255           # user moving
  dock_near_mm: 10          # dock sensor (port 7): closer than this = pill is on the sensor. Calibrate!
  motion_energy_moving: 0.05  # wearable energy (g) at/above this = moving. Calibrate!

# IMU/RSSI navigation is enabled only while Story owns an active walking episode.
walking:
  close_rssi_dbm: -80
  return_power_drop: 0.20       # power ratio, equivalent to 0.9691 dB drop
  rssi_stale_s: 3
  motion_stale_s: 3
  reversal_pause_s: 0.2

# Coverage detector on robot_main port 7 (port 13 is the left eye).
dock:
  cover_pct: 60
  open_pct: 0
  hold_ms: 100
