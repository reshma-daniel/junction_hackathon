# Charlie's few non-speech sounds, made by Charlie's OWN voice with ElevenLabs v3 audio tags.
# Each line in `voice:` is one take; voice.py picks a different take each time.
# Tip: a few real words around the tag keep v3 closer to the companion voice.
# Rendered once, then free and offline. Keep this list short: only what reactions.yaml needs.

bark:            # attention / encouragement
  voice:
    - "[barking] Woof!"
    - "[barking] Arf!"
    - "[barking] Woof woof!"

happy_bark:      # being called, inviting to walk
  voice:
    - "[excited] [barking] Yip yip!"
    - "[happy] [barking] Arf arf!"

yawn:            # waking up
  voice:
    - "[yawning] Aaah... hello."

excited_spin:    # celebrating a finished task
  voice:
    - "[excited] Yay! [barking] Arf arf!"
    - "[happy] Woohoo! [barking] Woof!"
